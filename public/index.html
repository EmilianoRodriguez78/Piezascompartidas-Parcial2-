<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piezas compartidas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Piezas compartidas</h1>
        <nav id="pestanas">
            <button data-vista="catalogo" class="activa">Catálogo</button>
            <button data-vista="consultas">Consultas</button>
        </nav>
    </header>

    <div id="mensaje" hidden></div>

    <main>
        <section id="catalogo">
            <nav id="secciones"></nav>
            <div id="contenido-catalogo"></div>
        </section>
        <section id="consultas" hidden></section>
    </main>

    <script src="app.js"></script>
</body>
</html>
